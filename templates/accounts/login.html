{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center mt-5">

    <div class="col-md-5">

        <div class="card shadow-lg border-0">

            <div class="card-header bg-primary text-white text-center">
                <h3>Login</h3>
            </div>

            <div class="card-body p-4">

                <form method="post">

                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">
                            Username
                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            placeholder="Enter Username"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter Password"
                            required
                        >
                    </div>

                    <div class="d-grid">
                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Login
                        </button>
                    </div>

                </form>

            </div>

            <div class="card-footer text-center">

                Don't have an account?

                <a href="/register/">
                    Register Here
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
